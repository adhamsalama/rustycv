[package]
name = "rustycv-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rustycv-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-render = { version = "0.15.1", optional = true }
comemo = "0.4"

[features]
default = ["raster"]
# Rasterising a page is only wanted by the thumbnail and pixel-test paths. The
# browser build turns it off so the wasm module carries the PDF exporter alone.
raster = ["dep:typst-render"]

[dev-dependencies]
uuid = { workspace = true }
# Decodes rendered pages so tests can assert on what actually got drawn.
image = { version = "0.25", default-features = false, features = ["png"] }
