[workspace]
resolver = "2"
members = [
    "crates/rustycv-core",
    "crates/rustycv-render",
    "crates/rustycv-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Typst 0.15 requires 1.92; pin it so an old toolchain fails with a clear message.
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
rustycv-core = { path = "crates/rustycv-core" }
rustycv-render = { path = "crates/rustycv-render" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"

# Argon2 is meant to be slow, and unoptimized it is slow enough to dominate a
# test run — seconds per hash rather than tens of milliseconds. Optimizing just
# these two in dev builds keeps the cost parameters honest instead of tuning
# them down for the sake of the suite.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
